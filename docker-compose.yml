# Compose pour TESTER DownLL en local (Windows/Mac/Linux).
# Lancement le plus simple sur Windows :  double-clic sur test-docker.cmd
# ou :  pwsh ./scripts/docker-test.ps1
#
# Le port hôte est configurable via HOST_PORT (défaut 3000).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: downll:test
    container_name: downll-test
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MAX_CONCURRENT=3
      # Mot de passe d'accès. Vide = app ouverte ET navigateur intégré désactivé.
      # Définis-le (ex. dans un fichier .env) pour activer login + navigateur :
      #   AUTH_PASSWORD=tonmotdepasse docker compose up -d
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      # Jeton pour l'extension navigateur (envoi de cookies). Voir extension/README.md.
      - DOWNLL_TOKEN=${DOWNLL_TOKEN:-}
    tmpfs:
      - /tmp/downll
