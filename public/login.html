<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5b8cff" />
    <title>DownLL — Connexion</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: radial-gradient(1200px 600px at 50% -10%, #2a2f63 0%, #0f1226 55%);
        color: #eef1ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .box {
        width: min(360px, 92vw);
        background: linear-gradient(180deg, #1d2142, #171a35);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px; padding: 24px; text-align: center;
      }
      .logo {
        width: 56px; height: 56px; margin: 0 auto 10px; display: grid; place-items: center;
        font-size: 26px; border-radius: 18px;
        background: linear-gradient(160deg, #5b8cff, #7c3ad6);
      }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { margin: 0 0 18px; color: #9aa3c7; font-size: 14px; }
      input {
        width: 100%; padding: 13px 15px; border-radius: 12px; font-size: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1); background: #11142e; color: #eef1ff; outline: none;
      }
      input:focus { border-color: #5b8cff; box-shadow: 0 0 0 3px rgba(91, 140, 255, 0.25); }
      button {
        width: 100%; margin-top: 12px; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
        font-size: 16px; font-weight: 600; color: #fff;
        background: linear-gradient(180deg, #5b8cff, #4571e6);
      }
      .err { margin-top: 12px; color: #ffd2d8; font-size: 14px; min-height: 18px; }
    </style>
  </head>
  <body>
    <form class="box" id="f">
      <div class="logo" aria-hidden="true">⬇</div>
      <h1>DownLL</h1>
      <p>Accès protégé — entre le mot de passe.</p>
      <input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" autofocus />
      <button type="submit">Se connecter</button>
      <p class="err" id="err" role="alert"></p>
    </form>
    <script>
      const f = document.getElementById('f');
      const err = document.getElementById('err');
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.textContent = '';
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: document.getElementById('pw').value }),
          });
          if (res.ok) {
            location.replace('/');
          } else {
            const d = await res.json().catch(() => ({}));
            err.textContent = d.error || 'Échec de la connexion.';
          }
        } catch {
          err.textContent = 'Erreur réseau.';
        }
      });
    </script>
  </body>
</html>
