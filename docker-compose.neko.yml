# =====================================================================
#  Override OPTIONNEL : mode "📺 Live" = Neko (navigateur WebRTC + SON,
#  ~0,2 s de latence, A/V synchro propre via GStreamer).
# =====================================================================
#  À empiler sur le compose de base :
#    docker compose -f docker-compose.yml -f docker-compose.neko.yml up -d --build
#  Puis dans DownLL : onglet "📺 Live" (mot de passe Neko ci-dessous).
#
#  Compromis : Neko est un navigateur séparé -> pas de bouton ⬇ intégré.
#  Pour télécharger : copie l'URL depuis Neko et colle-la dans "Téléchargeur".
#
#  ⚠️ WebRTC = port UDP nécessaire.
#   - En local (Docker Desktop) : la plage UDP publiée suffit. NEKO_URL par
#     défaut = http://localhost:8088.
#   - Sur un SERVEUR derrière ton panel : expose la plage UDP, mets
#     NEKO_WEBRTC_NAT1TO1 = ton IP publique, et NEKO_URL = ton URL Neko (proxy).
#
#  Variantes d'image : ghcr.io/m1k1o/neko/{firefox,chromium,brave,tor-browser}.
#  Doc : https://github.com/m1k1o/neko
# =====================================================================

services:
  app:
    environment:
      # URL atteinte par TON navigateur (pas un hostname Docker interne).
      - NEKO_URL=${NEKO_URL:-http://localhost:8088}

  neko:
    image: ghcr.io/m1k1o/neko/firefox:latest
    container_name: downll-neko
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "${NEKO_PORT:-8088}:8080" # interface web (HTTP/WebSocket)
      - "52000-52010:52000-52010/udp" # flux média WebRTC (UDP)
    environment:
      NEKO_DESKTOP_SCREEN: "1280x720@30"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${NEKO_PASSWORD:-neko}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${NEKO_ADMIN_PASSWORD:-admin}"
      NEKO_WEBRTC_EPR: "52000-52010"
      NEKO_WEBRTC_ICELITE: "true"
      # SERVEUR distant : décommente avec ton IP publique
      # NEKO_WEBRTC_NAT1TO1: "TON.IP.PUBLIQUE"
